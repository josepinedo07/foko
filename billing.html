<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOKO · Facturación</title>
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0F1009">
  <link rel="stylesheet" href="css/design-system.css">
  <script src="js/errlog.js"></script>
  <style>
    body { min-height: 100%; }
    .page { max-width: 760px; margin: 0 auto; padding: 0 var(--s-5) var(--s-16); }
    .topbar { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4) 0; border-bottom: 1px solid var(--border); margin-bottom: var(--s-6); flex-wrap: wrap; }
    .topbar .spacer { flex: 1; }
    .nav-tabs { display: flex; gap: var(--s-1); }
    .nav-tabs a { font-family: var(--font-mono); font-size: var(--fs-11); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--text-dim); padding: var(--s-2) var(--s-3); border-radius: var(--r-cell); text-decoration: none; }
    .nav-tabs a[aria-current] { background: var(--surface-2); color: var(--text); }

    .card { border: 1px solid var(--border); border-radius: var(--r); padding: var(--s-6); margin-bottom: var(--s-5); }
    .card--feature { border-color: var(--accent); }
    .kv { display: grid; grid-template-columns: 160px 1fr; gap: var(--s-2) var(--s-4); font-size: var(--fs-14); }
    .kv dt { font-family: var(--font-mono); font-size: var(--fs-11); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--text-dim); }
    .kv dd { color: var(--text); }
    .price { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-40); letter-spacing: var(--tracking-display); }
    .price span { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--text-dim); font-weight: 400; }
    .trial-note { margin-top: var(--s-4); font-family: var(--font-mono); font-size: var(--fs-14); }
    .trial-note.warn { color: var(--warn); }
    .pill2 { font-family: var(--font-mono); font-size: var(--fs-11); text-transform: uppercase; border: 1px solid var(--border-strong); border-radius: var(--r-cell); padding: 1px 6px; color: var(--text-dim); }
    .cta { margin-top: var(--s-5); color: var(--text-dim); font-size: var(--fs-14); }
    .cta a { color: var(--accent-text); }
    .state { padding: var(--s-8) 0; text-align: center; color: var(--text-dim); font-family: var(--font-mono); font-size: var(--fs-12); }
  </style>
</head>
<body>
  <div class="page" id="page" hidden>
    <div class="topbar">
      <span id="logo" aria-label="Foko"></span>
      <span id="orgBadge" class="text-mute mono" style="font-size:var(--fs-12);"></span>
      <span class="spacer"></span>
      <nav class="nav-tabs">
        <a href="historial.html">Historial</a>
        <a href="team.html">Equipo</a>
        <a href="billing.html" aria-current="page">Facturación</a>
      </nav>
      <a class="btn btn--ghost" href="remote-expert.html">Sala de soporte</a>
    </div>

    <h1 style="font-size:var(--fs-20); font-weight:600; margin-bottom:var(--s-4);">Facturación</h1>

    <div class="card card--feature" id="planCard">
      <div class="price" id="planPrice">—</div>
      <div style="font-size:var(--fs-16); font-weight:600; margin:var(--s-1) 0 var(--s-4);" id="planName">—</div>
      <dl class="kv">
        <dt>Status</dt><dd><span class="pill2" id="bStatus">—</span></dd>
        <dt>Asientos</dt><dd id="bSeats">—</dd>
        <dt>Modo de cobro</dt><dd id="bMode">—</dd>
        <dt>Estimado / mes</dt><dd id="bMrr">—</dd>
      </dl>
      <div class="trial-note" id="bTrial" hidden></div>
    </div>

    <div class="cta" id="bCta"></div>
  </div>

  <div class="state" id="boot">Cargando…</div>

  <script type="module">
    import { supabase, requireSession } from './js/supabase-client.js';
    import { enforceAccess } from './js/gate.js';
    import { mountLogo } from './js/logo.js';
    import { toast } from './js/ui.js';

    const $ = (id) => document.getElementById(id);
    const usd = (c) => c == null ? '—' : '$' + Math.round(c / 100).toLocaleString('en-US');

    const state = await requireSession('login.html');
    if (state && !enforceAccess(state, { allowBilling: true })) throw new Error('acceso suspendido');
    if (!state) throw new Error('sin sesión');
    if (state.isPlatformAdmin && !state.company) { location.href = 'admin.html'; throw new Error('admin'); }
    if (!state.company) { $('boot').textContent = 'Tu cuenta no tiene organización.'; throw new Error('sin org'); }
    if (state.profile?.role !== 'org_admin') { location.href = 'historial.html'; throw new Error('no org_admin'); }

    $('boot').hidden = true; $('page').hidden = false;
    mountLogo($('logo'), { height: 26 });
    $('orgBadge').textContent = '· ' + state.company.name;

    const { data: b, error } = await supabase.rpc('org_billing');
    if (error) { toast(error.message, 'critical', 5000); throw error; }

    $('planName').textContent = b.plan ? b.plan.name : 'Sin plan asignado';
    $('planPrice').innerHTML = b.plan ? `${usd(b.plan.price_cents)} <span>/mes base</span>` : '—';
    $('bStatus').textContent = b.status;
    $('bStatus').className = 'pill2';
    $('bSeats').textContent = `${b.seats_used} de ${b.seat_limit}`;
    $('bMode').textContent = b.billing_mode === 'stripe' ? 'Stripe' : 'Manual';
    $('bMrr').textContent = usd(b.mrr_cents);

    if (b.status === 'trialing' && b.trial_ends_at) {
      const days = Math.ceil((new Date(b.trial_ends_at) - Date.now()) / 86400000);
      const el = $('bTrial'); el.hidden = false;
      if (days > 0) { el.textContent = `Trial: quedan ${days} día${days === 1 ? '' : 's'} (termina el ${new Date(b.trial_ends_at).toLocaleDateString('es-MX')}).`; }
      else { el.classList.add('warn'); el.textContent = `Tu trial terminó el ${new Date(b.trial_ends_at).toLocaleDateString('es-MX')}. Activa un plan para seguir usando FOKO.`; }
    }

    if (b.billing_mode === 'stripe') {
      $('bCta').innerHTML = `Gestiona tu plan, asientos y tarjeta en el
        <a href="#" id="portal">portal de facturación</a>.`;
      $('portal').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/billing-portal', {
            method: 'POST', headers: { Authorization: `Bearer ${state.session.access_token}` },
          });
          const d = await res.json();
          if (d.url) location.href = d.url; else toast(d.error || 'No disponible', 'critical', 5000);
        } catch (_) { toast('El portal no está disponible todavía.', 'warn', 5000); }
      });

      // Si aún no hay suscripción activa, ofrecer checkout de los planes visibles.
      if (b.status !== 'active') {
        const { data: pl } = await supabase.from('plans').select('*').eq('visible', true).order('sort');
        const box = document.createElement('div');
        box.style.marginTop = 'var(--s-5)';
        box.innerHTML = '<div class="label" style="margin-bottom:var(--s-2);">Activar un plan</div>' +
          (pl || []).map((p) => `<button class="btn" style="margin:0 var(--s-2) var(--s-2) 0;" data-plan="${p.id}">${p.name} · $${Math.round(p.price_cents / 100)}/mes</button>`).join('');
        box.addEventListener('click', async (e) => {
          const btn = e.target.closest('[data-plan]'); if (!btn) return;
          btn.disabled = true;
          try {
            const res = await fetch('/api/stripe-checkout', {
              method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.session.access_token}` },
              body: JSON.stringify({ plan_id: btn.dataset.plan, interval: 'month' }),
            });
            const d = await res.json();
            if (d.url) location.href = d.url; else { toast(d.error || 'No disponible', 'critical', 5000); btn.disabled = false; }
          } catch (_) { toast('Checkout no disponible.', 'warn', 5000); btn.disabled = false; }
        });
        $('bCta').after(box);
      }
    } else {
      $('bCta').innerHTML = `Para cambiar de plan o agregar asientos,
        escríbenos a <a href="mailto:privacidad@fokoremote.com?subject=Cambio%20de%20plan%20%E2%80%94%20${encodeURIComponent(state.company.name)}">privacidad@fokoremote.com</a>.
        Ver <a href="precios.html">planes</a>.`;
    }
  </script>
</body>
</html>
