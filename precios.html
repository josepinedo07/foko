<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOKO · Precios</title>
  <meta name="description" content="Planes de FOKO — soporte técnico remoto por video. Pagas por experto; los técnicos de campo son ilimitados y gratis.">
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0F1009">
  <link rel="stylesheet" href="css/design-system.css">
  <script src="js/errlog.js"></script>
  <style>
    body { overflow-x: hidden; }
    .page { max-width: 1120px; margin: 0 auto; padding: 0 var(--s-6) var(--s-16); }
    .nav { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-6) 0; }
    .nav .spacer { flex: 1; }

    .head { text-align: center; padding: var(--s-12) 0 var(--s-6); }
    .head h1 { font-family: var(--font-display); font-weight: 700; letter-spacing: var(--tracking-display); font-size: clamp(30px, 5vw, 52px); line-height: 1.12; }
    .head p { color: var(--text-dim); font-size: var(--fs-16); margin-top: var(--s-4); max-width: 48ch; margin-inline: auto; }

    .toggle { display: inline-flex; gap: var(--s-1); padding: var(--s-1); border: 1px solid var(--border); border-radius: var(--r); margin: var(--s-6) auto 0; }
    .toggle button { background: transparent; border: 0; cursor: pointer; padding: var(--s-2) var(--s-4); border-radius: var(--r-cell); font-family: var(--font-mono); font-size: var(--fs-11); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--text-dim); }
    .toggle button[aria-pressed='true'] { background: var(--surface-2); color: var(--text); }
    .toggle .save { color: var(--accent-text); }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-4); margin-top: var(--s-8); align-items: stretch; max-width: 840px; margin-inline: auto; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; max-width: 400px; } }
    

    .plan { border: 1px solid var(--border); border-radius: var(--r); padding: var(--s-5); display: flex; flex-direction: column; }
    .plan--feature { border-color: var(--accent); }
    .plan--enter { background: var(--surface); }
    .plan__tag { font-family: var(--font-mono); font-size: var(--fs-11); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--accent-text); min-height: 1.2em; }
    .plan__name { font-size: var(--fs-16); font-weight: 600; margin-top: var(--s-1); }
    .plan__price { margin: var(--s-3) 0 var(--s-1); }
    .plan__price b { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-28); letter-spacing: var(--tracking-display); }
    .plan__price span { color: var(--text-dim); font-family: var(--font-mono); font-size: var(--fs-11); }
    .plan__sub { color: var(--text-mute); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.03em; min-height: 2.6em; line-height: 1.4; }
    .plan ul { list-style: none; margin: var(--s-4) 0; padding: 0; display: flex; flex-direction: column; gap: var(--s-2); flex: 1; }
    .plan li { display: flex; gap: var(--s-2); color: var(--text-dim); font-size: var(--fs-12); line-height: 1.4; }
    .plan li svg { width: 13px; height: 13px; flex: none; margin-top: 3px; stroke: var(--accent); fill: none; stroke-width: 2.2; }
    .plan li.hi span { color: var(--text); }
    .plan__name { font-size: var(--fs-16); font-weight: 600; margin-top: var(--s-1); }
    .plan__price b { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-40); letter-spacing: var(--tracking-display); }
    .plan .btn { width: 100%; }

    footer { padding: var(--s-12) 0 var(--s-8); display: flex; gap: var(--s-4); flex-wrap: wrap; align-items: center; border-top: 1px solid var(--border); margin-top: var(--s-10); }
    footer a { color: var(--text-dim); font-size: var(--fs-12); }
    footer .spacer { flex: 1; }
  </style>
</head>
<body>
  <div class="page">
    <header class="nav">
      <a href="index.html" id="navLogo" aria-label="Foko"></a>
      <span class="spacer"></span>
      <a class="btn btn--ghost" href="index.html">Inicio</a>
      <a class="btn" href="login.html">Iniciar sesión</a>
    </header>

    <div class="head">
      <h1>Pagas por experto, no por llamada</h1>
      <p>El asiento es para quien <strong>guía</strong> la sesión. Los técnicos de campo que comparten cámara son ilimitados y sin costo. Onboarding acompañado.</p>
      <div class="toggle" role="group" aria-label="Periodo de facturación">
        <button id="tMonth" aria-pressed="true">Mensual</button>
        <button id="tYear" aria-pressed="false">Anual <span class="save">−17%</span></button>
      </div>
    </div>

    <div class="grid" id="grid"><p class="label" style="grid-column:1/-1; text-align:center;">Cargando planes…</p></div>

    <footer>
      <span id="footLogo" aria-label="Foko"></span>
      <span class="spacer"></span>
      <a href="privacidad.html">Privacidad</a>
      <a href="terminos.html">Condiciones</a>
    </footer>
  </div>

  <script type="module">
    import { supabase } from './js/supabase-client.js';
    import { mountLogo } from './js/logo.js';

    mountLogo(document.getElementById('navLogo'), { height: 44 });
    mountLogo(document.getElementById('footLogo'), { height: 30, showDot: false });

    const CHECK = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    const DEMO = 'mailto:ventas@fokoremote.com?subject=Agendar%20demo%20FOKO';
    let annual = false;
    let plans = [];

    const usd = (cents) => '$' + (cents / 100).toLocaleString('en-US', { maximumFractionDigits: 0 });
    
    function planCard(p) {
      const monthly = p.price_cents;
      const shown = annual ? monthly * 10 : monthly;   // anual = mensual × 10 (−17%)
      const per = annual ? '/año' : '/mes';
      const isFeature = p.id === 'equipo';
      const seats = p.included_seats;
      const retention = p.recording_retention_days || p.retention_days || 30;

      return `<article class="plan ${isFeature ? 'plan--feature' : ''}">
        <div class="plan__tag">${isFeature ? 'Más elegido' : ''}</div>
        <div class="plan__name">${p.name}</div>
        <div class="plan__price"><b>${usd(shown)}</b> <span>${per}</span></div>
        <div class="plan__sub">${seats} ${seats === 1 ? 'experto' : 'expertos'} (quien guía la sesión)</div>
        <ul>
          <li class="hi">${CHECK}<span><strong>Técnicos de campo ilimitados y sin costo</strong></span></li>
          <li>${CHECK}<span>Puntero, dibujo, congelar, fotos y grabación</span></li>
          <li>${CHECK}<span>Notas internas de sesión y de coaching</span></li>
          <li>${CHECK}<span>Reporte de servicio con IA</span></li>
          <li>${CHECK}<span>Grabaciones se conservan ${retention} días</span></li>
          <li>${CHECK}<span>Una sesión activa por persona</span></li>
        </ul>
        <a class="btn ${isFeature ? 'btn--primary' : ''}" href="checkout.html?plan=${encodeURIComponent(p.id)}&interval=${annual ? 'year' : 'month'}">Suscribirme</a>
      </article>`;
    }

    function enterpriseCard() {
      return `<article class="plan plan--enter">
        <div class="plan__tag">A tu medida</div>
        <div class="plan__name">Enterprise</div>
        <div class="plan__price"><b>Hablemos</b></div>
        <div class="plan__sub">Más de 3 asientos</div>
        <ul>
          <li>${CHECK}<span>Asientos de experto a medida</span></li>
          <li>${CHECK}<span>Retención de grabaciones extendida</span></li>
          <li>${CHECK}<span>SSO y exportación de notas</span></li>
          <li>${CHECK}<span>Soporte dedicado</span></li>
        </ul>
        <a class="btn" href="${DEMO}">Agendar demo</a>
      </article>`;
    }

    function render() {
      const grid = document.getElementById('grid');
      if (!plans.length) { grid.innerHTML = '<p class="label" style="grid-column:1/-1;text-align:center;">No se pudieron cargar los planes.</p>'; return; }
      grid.innerHTML = plans.map(planCard).join('') + enterpriseCard();
    }

    document.getElementById('tMonth').addEventListener('click', () => setPeriod(false));
    document.getElementById('tYear').addEventListener('click', () => setPeriod(true));
    function setPeriod(a) {
      annual = a;
      document.getElementById('tMonth').setAttribute('aria-pressed', String(!a));
      document.getElementById('tYear').setAttribute('aria-pressed', String(a));
      render();
    }

    // Tolera que la migración phase-plans-v2 no se haya corrido: si no hay
    // columna `visible`, se filtra por `hidden` en el cliente.
    const { data } = await supabase.from('plans').select('*').order('sort');
    plans = (data || []).filter((p) => p.visible ?? !p.hidden);
    render();
  </script>
</body>
</html>
