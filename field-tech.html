<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FieldLens · Técnico en campo</title>
  <link rel="stylesheet" href="css/design-system.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { overflow: hidden; touch-action: none; background: #000; }
    .view { position: fixed; inset: 0; }

    #feed { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #ar { position: absolute; inset: 0; width: 100%; height: 100%; }

    .topbar {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none;
    }
    .topbar .status { pointer-events: auto; }

    .dock {
      position: absolute; left: 0; right: 0; bottom: 22px;
      display: flex; justify-content: center; align-items: center; gap: 16px;
    }
    .fab {
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(23,26,33,0.9);
      border: 1px solid var(--border);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
    }
    .fab.on { background: var(--accent); border-color: var(--accent); }
    .fab.point {
      width: 72px; height: 72px; font-size: 0.85rem; font-weight: 700;
      background: var(--accent); border: none;
    }

    .freeze-tag {
      position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
      background: var(--warn); color: #1a1200; font-weight: 700; font-size: 0.78rem;
      padding: 5px 12px; border-radius: 999px; display: none;
    }

    .screen-overlay {
      position: absolute; inset: 0; background: #000; z-index: 20;
      display: none; flex-direction: column;
    }
    .screen-overlay.on { display: flex; }
    .screen-overlay video { flex: 1; width: 100%; object-fit: contain; }
    .screen-overlay .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--surface); }

    .gate {
      position: absolute; inset: 0; z-index: 30;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 28px; text-align: center;
    }
    .gate h1 { font-size: 1.4rem; }
    .gate p { color: var(--text-dim); max-width: 320px; line-height: 1.5; }
    .gate .field { text-align: center; text-transform: uppercase; max-width: 220px; }
  </style>
</head>
<body>
  <div class="view">
    <video id="feed" autoplay playsinline muted></video>
    <canvas id="ar"></canvas>
    <audio id="expertAudio" autoplay></audio>

    <div class="topbar">
      <span id="status" class="status">conectando…</span>
    </div>

    <div class="freeze-tag" id="freezeTag">El remoto congeló la imagen</div>

    <div class="dock" id="dock" hidden>
      <button class="fab" id="btnMic" title="Silenciar">🎤</button>
      <button class="fab point" id="btnPoint" title="Señalar">Señalar</button>
      <button class="fab" id="btnFlip" title="Voltear cámara">🔄</button>
      <button class="fab" id="btnTorch" title="Linterna">🔦</button>
    </div>

    <div class="screen-overlay" id="screenOverlay">
      <div class="bar">
        <span class="status">Pantalla del remoto</span>
        <button class="btn" id="btnCloseScreen">Ocultar</button>
      </div>
      <video id="screenVideo" autoplay playsinline></video>
    </div>

    <div class="gate" id="gate">
      <h1>FieldLens</h1>
      <p>Vas a compartir la cámara de tu teléfono con el técnico remoto.</p>
      <input class="field" id="codeInput" placeholder="FL-XXXX" maxlength="12" autocomplete="off">
      <button class="btn btn-primary" id="btnConnect" style="min-width:200px;">Conectar cámara</button>
      <p id="gateErr" style="color:var(--danger); display:none;"></p>
    </div>
  </div>

  <script type="module">
    import { ARCanvas } from './js/ar-canvas.js';
    import { WebRTCManager } from './js/webrtc-manager.js';

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const feed = $('feed');
    const statusEl = $('status');
    let webrtc = null;
    let micOn = true;

    const initialRoom = (params.get('room') || '').toUpperCase();
    $('codeInput').value = initialRoom;
    if (initialRoom) $('codeInput').style.display = 'none';

    const ar = new ARCanvas($('ar'), {
      interactive: true,
      getAspect: () => (feed.videoWidth ? feed.videoWidth / feed.videoHeight : null),
      onEmit: (msg) => webrtc && webrtc.send(msg),
    });
    ar.tool = 'pointer';
    ar.color = '#ffd60a';

    $('btnConnect').addEventListener('click', connect);
    $('codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });

    async function connect() {
      const room = ($('codeInput').value || initialRoom).trim().toUpperCase();
      if (!room) { showErr('Escribe el código de sala.'); return; }

      webrtc = new WebRTCManager({
        role: 'field',
        roomCode: room,
        onRemoteStream: (stream) => {
          $('expertAudio').srcObject = stream;      // audio del experto
          $('expertAudio').play().catch(() => {});
        },
        onScreenStream: (stream) => {
          $('screenVideo').srcObject = stream;
          $('screenOverlay').classList.add('on');
        },
        onScreenStreamEnded: () => $('screenOverlay').classList.remove('on'),
        onData: (msg) => {
          if (msg.type === 'hello') return;
          if (msg.type === 'screen') { if (!msg.active) $('screenOverlay').classList.remove('on'); return; }
          if (msg.type === 'freeze') { $('freezeTag').style.display = msg.dataUrl ? 'block' : 'none'; }
          ar.handleRemote(msg);
        },
        onStatus: (s) => {
          if (s.state === 'connected') { statusEl.className = 'status connected'; statusEl.textContent = 'Conectado'; }
          else if (s.state === 'waiting') { statusEl.className = 'status waiting'; statusEl.textContent = 'Buscando al remoto…'; }
          else if (s.state === 'disconnected') { statusEl.className = 'status waiting'; statusEl.textContent = 'Remoto desconectado'; }
          else if (s.state === 'error') { showErr(s.message || 'Error de conexión'); statusEl.className = 'status error'; statusEl.textContent = 'Error'; }
        },
      });

      try {
        const stream = await webrtc.startCamera();
        feed.srcObject = stream;
      } catch (e) {
        showErr('No se pudo acceder a la cámara. Revisa los permisos del navegador.');
        return;
      }

      await webrtc.initPeer();
      $('gate').style.display = 'none';
      $('dock').hidden = false;
    }

    function showErr(m) { const el = $('gateErr'); el.textContent = m; el.style.display = 'block'; }

    // Señalar: toque en el video ya emite ping vía ARCanvas; el botón manda uno al centro.
    $('btnPoint').addEventListener('click', () => {
      ar.addPing(0.5, 0.5, ar.color);
      webrtc && webrtc.send({ type: 'ping', x: 0.5, y: 0.5, color: ar.color });
    });

    $('btnMic').addEventListener('click', () => {
      micOn = !micOn;
      webrtc.setMicEnabled(micOn);
      $('btnMic').classList.toggle('on', !micOn);
      $('btnMic').textContent = micOn ? '🎤' : '🔇';
    });

    $('btnFlip').addEventListener('click', async () => {
      try { feed.srcObject = await webrtc.switchCamera(); } catch (_) {}
    });

    const btnTorch = $('btnTorch');
    btnTorch.addEventListener('click', async () => {
      const on = await webrtc.toggleTorch();
      btnTorch.classList.toggle('on', on);
    });

    $('btnCloseScreen').addEventListener('click', () => $('screenOverlay').classList.remove('on'));
    window.addEventListener('beforeunload', () => webrtc && webrtc.destroy());
  </script>
</body>
</html>
