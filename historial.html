<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOKO · Historial de soporte</title>
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0F1009">
  <link rel="stylesheet" href="css/design-system.css">
  <script src="js/errlog.js"></script>
  <style>
    body { min-height: 100%; }
    .page { max-width: 1080px; margin: 0 auto; padding: 0 var(--s-5) var(--s-16); }

    .topbar {
      display: flex; align-items: center; gap: var(--s-3);
      padding: var(--s-4) 0; border-bottom: 1px solid var(--border); margin-bottom: var(--s-6);
    }
    .topbar .spacer { flex: 1; }
    .company-badge { color: var(--text-dim); font-size: var(--fs-12); white-space: nowrap; }

    .bar { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-5); flex-wrap: wrap; }
    .bar h1 { font-size: var(--fs-20); font-weight: 600; }
    .bar .spacer { flex: 1; }
    .search { width: 220px; }

    .list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
    .row {
      display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,2fr) 92px 108px;
      gap: var(--s-4); align-items: center;
      padding: var(--s-4); border-bottom: 1px solid var(--border);
      cursor: pointer; background: none; text-align: left; width: 100%; color: inherit; font: inherit;
    }
    .row:last-child { border-bottom: 0; }
    .row:hover { background: var(--surface); }
    .row__client { font-weight: 600; font-size: var(--fs-14); }
    .row__date { font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-mute); margin-top: 2px; }
    .row__desc { color: var(--text-dim); font-size: var(--fs-12); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row__dur { font-family: var(--font-mono); font-size: var(--fs-12); color: var(--text-dim); }
    .row__media { display: flex; gap: var(--s-3); font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-mute); }
    .row__media span { display: inline-flex; align-items: center; gap: 4px; }
    .row__media svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.75; }
    @media (max-width: 720px) {
      .row { grid-template-columns: 1fr auto; }
      .row__desc, .row__dur { display: none; }
    }

    .state { padding: var(--s-12) var(--s-4); text-align: center; color: var(--text-dim); }
    .state p { font-family: var(--font-mono); font-size: var(--fs-12); margin-bottom: var(--s-4); }

    /* Detalle */
    .modal__card { max-width: 720px; }
    .detail__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-3); }
    .detail__meta { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-5); margin: var(--s-3) 0 var(--s-5); font-family: var(--font-mono); font-size: var(--fs-11); color: var(--text-dim); }
    .detail__meta b { color: var(--text-mute); font-weight: 400; text-transform: uppercase; letter-spacing: var(--tracking-label); margin-right: var(--s-1); }
    .detail__desc { color: var(--text-dim); font-size: var(--fs-14); line-height: 1.6; white-space: pre-wrap; margin-bottom: var(--s-5); }
    .detail__section-label { display: block; margin: var(--s-5) 0 var(--s-2); }

    .grid-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--s-2); }
    .grid-photos img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border: 1px solid var(--border-strong); border-radius: var(--r-cell); cursor: zoom-in; }
    .videos { display: flex; flex-direction: column; gap: var(--s-3); }
    .videos video { width: 100%; border: 1px solid var(--border-strong); border-radius: var(--r-cell); background: var(--video-void); }

    .edit-row { display: flex; flex-direction: column; gap: var(--s-2); margin-bottom: var(--s-4); }

    .lightbox { position: fixed; inset: 0; z-index: 300; display: none; align-items: center; justify-content: center; padding: var(--s-5); background: color-mix(in srgb, var(--video-void) 85%, transparent); cursor: zoom-out; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: var(--r-cell); }
  </style>
</head>
<body>
  <div class="page" id="page" hidden>
    <div class="topbar">
      <span id="logo" aria-label="Foko"></span>
      <span id="companyBadge" class="company-badge" hidden></span>
      <span class="spacer"></span>
      <a class="btn btn--ghost" href="team.html" id="lnkTeam" hidden>Equipo</a>
      <a class="btn btn--ghost" href="billing.html" id="lnkBilling" hidden>Facturación</a>
      <a class="btn btn--ghost" href="remote-expert.html" id="btnSettings" aria-label="Ajustes (en la sala de soporte)" title="Ajustes">
        <svg class="icon icon--sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1L14.5 2h-5l-.4 2.6a7 7 0 0 0-1.7 1l-2.3-1-2 3.4L3 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.4 2.6h5l.4-2.6a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5a7 7 0 0 0 .1-1z"/></svg>
      </a>
      <button class="btn btn--ghost" id="btnLogout">Cerrar sesión</button>
      <a class="btn btn--primary" href="remote-expert.html">Sala de soporte</a>
    </div>

    <div class="bar">
      <h1>Historial de soporte</h1>
      <span class="spacer"></span>
      <input class="field search" id="search" type="search" placeholder="Buscar cliente…" autocomplete="off">
    </div>

    <div id="listWrap"></div>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal__card">
      <div class="detail__head">
        <h2 class="modal__title" id="dTitle">—</h2>
        <button class="btn btn--ghost btn-icon" id="dClose" aria-label="Cerrar">
          <svg class="icon icon--sm" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="detail__meta" id="dMeta"></div>

      <div id="dView">
        <p class="detail__desc" id="dDesc"></p>
      </div>
      <div id="dEdit" hidden>
        <div class="edit-row">
          <span class="label">Cliente</span>
          <input class="field" id="dEditClient">
        </div>
        <div class="edit-row">
          <span class="label">Descripción</span>
          <textarea class="field" id="dEditDesc" rows="4"></textarea>
        </div>
        <div class="field-row" style="display:flex; gap:var(--s-2);">
          <button class="btn btn--primary" id="dSave">Guardar</button>
          <button class="btn btn--ghost" id="dCancel">Cancelar</button>
        </div>
      </div>

      <span class="label detail__section-label" id="dPhotosLabel" hidden>Fotos</span>
      <div class="grid-photos" id="dPhotos"></div>
      <span class="label detail__section-label" id="dVideosLabel" hidden>Videos</span>
      <div class="videos" id="dVideos"></div>

      <div style="display:flex; justify-content:space-between; margin-top:var(--s-6);">
        <button class="btn btn--danger" id="dDelete">Eliminar</button>
        <button class="btn" id="dEditBtn">Editar</button>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

  <div class="state" id="boot">Cargando…</div>

  <script type="module">
    import { supabase, requireSession } from './js/supabase-client.js';
    import { enforceAccess } from './js/gate.js';
    import { mountLogo } from './js/logo.js';
    import { toast } from './js/ui.js';
    import { logAudit } from './js/audit.js';

    const $ = (id) => document.getElementById(id);

    const state = await requireSession('login.html');
    if (state && !enforceAccess(state)) throw new Error('acceso suspendido');
    if (!state) throw new Error('sin sesión');
    if (state.isPlatformAdmin && !state.company) { location.href = 'admin.html'; throw new Error('admin'); }
    if (!state.company) {
      $('boot').textContent = 'Tu cuenta no tiene una empresa. Ve a login.';
      throw new Error('sin empresa');
    }

    const company = state.company;
    $('boot').hidden = true;
    $('page').hidden = false;
    mountLogo($('logo'), { height: 26 });
    $('companyBadge').textContent = `· ${company.name}`;
    $('companyBadge').hidden = false;
    if (state.profile?.role === 'org_admin') {
      $('lnkTeam').hidden = false;
      $('lnkBilling').hidden = false;
    }

    $('btnLogout').addEventListener('click', async () => { await supabase.auth.signOut(); location.href = 'login.html'; });

    const fmtDateTime = (s) => s ? new Date(s).toLocaleString('es-MX', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
    const fmtDur = (sec) => {
      if (!sec && sec !== 0) return '—';
      const m = Math.floor(sec / 60), s = sec % 60;
      return m ? `${m} min ${s ? s + 's' : ''}`.trim() : `${s}s`;
    };
    const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    let sessions = [];

    async function load() {
      const { data, error } = await supabase
        .from('sessions')
        .select('*, session_media ( id, kind, url, storage_path )')
        .eq('company_id', company.id)
        .order('created_at', { ascending: false });
      if (error) { $('listWrap').innerHTML = `<div class="state"><p>No se pudo cargar: ${esc(error.message)}</p></div>`; return; }
      sessions = data || [];
      render();
    }

    function render() {
      const q = $('search').value.trim().toLowerCase();
      const rows = sessions.filter((s) => !q || (s.client_name || '').toLowerCase().includes(q));
      if (!sessions.length) {
        $('listWrap').innerHTML = `<div class="state"><p>Aún no hay sesiones guardadas.</p><a class="btn btn--primary" href="remote-expert.html">Abrir la sala de soporte</a></div>`;
        return;
      }
      if (!rows.length) { $('listWrap').innerHTML = `<div class="state"><p>Ningún cliente coincide con "${esc(q)}".</p></div>`; return; }
      $('listWrap').innerHTML = '<div class="list">' + rows.map((s) => {
        const photos = (s.session_media || []).filter((m) => m.kind === 'photo').length;
        const videos = (s.session_media || []).filter((m) => m.kind === 'video').length;
        return `<button class="row" data-id="${s.id}">
          <div>
            <div class="row__client">${esc(s.client_name) || 'Sin cliente'}</div>
            <div class="row__date">${fmtDateTime(s.created_at)}</div>
          </div>
          <div class="row__desc">${esc(s.description) || '—'}</div>
          <div class="row__dur">${fmtDur(s.duration_seconds)}</div>
          <div class="row__media">
            <span title="Fotos"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>${photos}</span>
            <span title="Videos"><svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>${videos}</span>
          </div>
        </button>`;
      }).join('') + '</div>';
    }

    $('search').addEventListener('input', render);
    $('listWrap').addEventListener('click', (e) => {
      const row = e.target.closest('.row');
      if (row) openDetail(row.dataset.id);
    });

    // ---- Detalle ----
    let current = null;
    async function openDetail(id) {
      const s = sessions.find((x) => x.id === id);
      if (!s) return;
      current = s;
      $('dTitle').textContent = s.client_name || 'Sin cliente';
      $('dMeta').innerHTML = [
        `<span><b>fecha</b>${fmtDateTime(s.created_at)}</span>`,
        `<span><b>duración</b>${fmtDur(s.duration_seconds)}</span>`,
        s.room_code ? `<span><b>código</b>${esc(s.room_code)}</span>` : '',
      ].join('');
      $('dDesc').textContent = s.description || 'Sin descripción.';

      const media = s.session_media || [];
      const photos = media.filter((m) => m.kind === 'photo');
      const videos = media.filter((m) => m.kind === 'video');

      // Bucket privado → URLs firmadas temporales (1 h).
      const paths = media.map((m) => m.storage_path).filter(Boolean);
      const signed = {};
      if (paths.length) {
        const { data } = await supabase.storage.from('sessions').createSignedUrls(paths, 3600);
        (data || []).forEach((d) => { if (d && d.signedUrl) signed[d.path] = d.signedUrl; });
      }
      const urlFor = (m) => signed[m.storage_path] || m.url || '';

      $('dPhotosLabel').hidden = !photos.length;
      $('dPhotos').innerHTML = photos.map((m) => `<img src="${esc(urlFor(m))}" alt="Foto de la sesión" loading="lazy">`).join('');
      $('dVideosLabel').hidden = !videos.length;
      $('dVideos').innerHTML = videos.map((m) => `<video src="${esc(urlFor(m))}" controls preload="metadata"></video>`).join('');

      $('dView').hidden = false; $('dEdit').hidden = true;
      $('detailModal').classList.add('open');
    }
    $('dClose').addEventListener('click', () => $('detailModal').classList.remove('open'));
    $('detailModal').addEventListener('click', (e) => { if (e.target === $('detailModal')) $('detailModal').classList.remove('open'); });

    $('dPhotos').addEventListener('click', (e) => {
      if (e.target.tagName === 'IMG') { $('lightboxImg').src = e.target.src; $('lightbox').classList.add('open'); }
    });
    $('lightbox').addEventListener('click', () => $('lightbox').classList.remove('open'));

    $('dEditBtn').addEventListener('click', () => {
      $('dEditClient').value = current.client_name || '';
      $('dEditDesc').value = current.description || '';
      $('dView').hidden = true; $('dEdit').hidden = false;
    });
    $('dCancel').addEventListener('click', () => { $('dView').hidden = false; $('dEdit').hidden = true; });
    $('dSave').addEventListener('click', async () => {
      const client_name = $('dEditClient').value.trim();
      const description = $('dEditDesc').value.trim();
      const { error } = await supabase.from('sessions').update({ client_name, description }).eq('id', current.id);
      if (error) { toast('No se pudo guardar: ' + error.message, 'critical', 5000); return; }
      current.client_name = client_name; current.description = description;
      logAudit('session.updated', 'session', current.id, {});
      toast('Guardado', 'ok', 1500);
      render(); openDetail(current.id);
    });

    $('dDelete').addEventListener('click', async () => {
      if (!window.confirm(`Eliminar la sesión de "${current.client_name || 'Sin cliente'}" y sus archivos. ¿Seguro?`)) return;
      const paths = (current.session_media || []).map((m) => m.storage_path).filter(Boolean);
      if (paths.length) { try { await supabase.storage.from('sessions').remove(paths); } catch (_) {} }
      const delId = current.id, delClient = current.client_name;
      const { error } = await supabase.from('sessions').delete().eq('id', delId);
      if (error) { toast('No se pudo eliminar: ' + error.message, 'critical', 5000); return; }
      logAudit('session.deleted', 'session', delId, { client: delClient || null });
      $('detailModal').classList.remove('open');
      toast('Sesión eliminada', 'ok', 1500);
      load();
    });

    load();
  </script>
</body>
</html>
